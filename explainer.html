<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="A layered visualization of Earth's, the Sun's, the Milky Way's, and the Local Group's motion through space." />
<title>How We Move Through the Cosmos</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --panel: #ffffff;
    --fg: #172033;
    --muted: #5b6475;
    --line: #8a94a6;
    --faint: #e8ebf0;
    --orbit: #147d73;
    --galactic: #315fbd;
    --local: #7655c5;
    --cosmic: #b76200;
    --result: #b3264a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1420;
      --panel: #151e2d;
      --fg: #edf1f7;
      --muted: #aab4c5;
      --line: #778398;
      --faint: #273245;
      --orbit: #56c7b8;
      --galactic: #78a6ff;
      --local: #b49afa;
      --cosmic: #ffb357;
      --result: #ff7091;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1180px; margin: 32px auto; padding: 0 20px 32px; }
  svg { width: 100%; height: auto; display: block; }
  .panel { fill: var(--panel); stroke: var(--faint); stroke-width: 1.5; }
  .rule { stroke: var(--faint); stroke-width: 1.5; }
  .axis { stroke: var(--line); stroke-width: 1; stroke-dasharray: 5 5; fill: none; }
  .orbit-line { stroke: var(--orbit); stroke-width: 3; fill: none; }
  .galactic-line { stroke: var(--galactic); stroke-width: 3; fill: none; }
  .local-line { stroke: var(--local); stroke-width: 3; fill: none; }
  .cosmic-line { stroke: var(--cosmic); stroke-width: 4; fill: none; }
  .result-line { stroke: var(--result); stroke-width: 4; fill: none; }
  .title { font-size: 30px; font-weight: 760; fill: var(--fg); letter-spacing: -0.5px; }
  .subtitle { font-size: 15px; fill: var(--muted); }
  .section { font-size: 16px; font-weight: 730; fill: var(--fg); }
  .label { font-size: 14px; font-weight: 700; fill: var(--fg); }
  .body { font-size: 13px; fill: var(--muted); }
  .small { font-size: 11px; fill: var(--muted); }
  .speed { font-size: 15px; font-weight: 760; }
  .orbit-text { fill: var(--orbit); }
  .galactic-text { fill: var(--galactic); }
  .local-text { fill: var(--local); }
  .cosmic-text { fill: var(--cosmic); }
  .result-text { fill: var(--result); }
  .dot { fill: var(--fg); }
  .open-dot { fill: var(--panel); stroke: var(--fg); stroke-width: 2; }
  .pill { fill: var(--faint); }
  .equation { font-size: 16px; font-weight: 730; fill: var(--fg); }
</style>
<main>
<svg viewBox="0 0 1140 900" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">How We Move Through the Cosmos</title>
  <desc id="diagram-desc">A layered diagram showing Earth's orbit around the Sun, the Sun's orbit around the Milky Way, Milky Way motion within the Local Group, Local Group motion relative to the cosmic microwave background, and the resulting Solar System velocity.</desc>

  <defs>
    <marker id="arrow-orbit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--orbit)" />
    </marker>
    <marker id="arrow-galactic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--galactic)" />
    </marker>
    <marker id="arrow-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--local)" />
    </marker>
    <marker id="arrow-cosmic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cosmic)" />
    </marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--result)" />
    </marker>
  </defs>

  <!-- Panel backgrounds sit behind every connector. -->
  <rect x="0" y="105" width="545" height="690" rx="18" class="panel" />
  <rect x="570" y="105" width="570" height="690" rx="18" class="panel" />

  <!-- Connectors are drawn before foreground nodes and labels. -->
  <path class="orbit-line" marker-end="url(#arrow-orbit)" d="M 91 272 A 42 22 0 1 1 122 281" />
  <path class="galactic-line" marker-end="url(#arrow-galactic)" d="M 90 415 C 150 359, 242 359, 307 410" />
  <path class="local-line" marker-end="url(#arrow-local)" d="M 108 553 C 162 520, 229 520, 286 550" />
  <path class="cosmic-line" marker-end="url(#arrow-cosmic)" d="M 122 703 C 182 653, 251 635, 319 640" />

  <!-- Vector triangle connectors. Lengths are illustrative. -->
  <path class="axis" d="M 790 437 L 1015 437 M 790 437 L 790 165" />
  <path class="cosmic-line" marker-end="url(#arrow-cosmic)" d="M 790 437 L 610 199" />
  <path class="local-line" marker-end="url(#arrow-local)" d="M 610 199 L 695 313" />
  <path class="result-line" marker-end="url(#arrow-result)" d="M 790 437 L 695 313" />

  <!-- Header -->
  <text x="0" y="45" class="title">How We Move Through the Cosmos</text>
  <text x="0" y="73" class="subtitle">Different motions use different reference frames. They combine as 3D vectors—not as speeds on one cosmic speedometer.</text>

  <!-- Left panel: nested scales -->
  <text x="28" y="140" class="section">Four nested scales</text>
  <text x="28" y="163" class="body">Each arrow answers “moving relative to what?”</text>
  <line x1="28" y1="184" x2="517" y2="184" class="rule" />

  <!-- Earth card -->
  <circle cx="108" cy="259" r="15" fill="var(--cosmic)" />
  <circle cx="146" cy="265" r="6" fill="var(--galactic)" />
  <text x="195" y="231" class="label">Earth around the Sun</text>
  <text x="195" y="257" class="speed orbit-text">≈ 30 km/s</text>
  <text x="195" y="280" class="body">Direction changes continuously over one year.</text>
  <text x="195" y="300" class="body">This adds a small annual wobble to the CMB vector.</text>
  <line x1="28" y1="326" x2="517" y2="326" class="rule" />

  <!-- Galactic orbit card -->
  <ellipse cx="198" cy="416" rx="112" ry="42" class="axis" />
  <circle cx="198" cy="416" r="10" class="dot" />
  <circle cx="92" cy="403" r="7" fill="var(--cosmic)" />
  <text x="337" y="375" class="label">Sun around the Milky Way</text>
  <text x="337" y="401" class="speed galactic-text">≈ 240 km/s</text>
  <text x="337" y="424" class="body">Current sky direction: Galactic</text>
  <text x="337" y="443" class="body">longitude 90°, toward Cygnus.</text>
  <text x="198" y="465" text-anchor="middle" class="small">Galactic center</text>
  <line x1="28" y1="482" x2="517" y2="482" class="rule" />

  <!-- Local Group card -->
  <ellipse cx="110" cy="552" rx="46" ry="20" class="axis" />
  <ellipse cx="298" cy="552" rx="55" ry="23" class="axis" />
  <circle cx="110" cy="552" r="9" fill="var(--galactic)" />
  <circle cx="298" cy="552" r="11" fill="var(--local)" />
  <text x="91" y="590" class="small">Milky Way</text>
  <text x="273" y="590" class="small">Andromeda</text>
  <text x="353" y="524" class="label">Within the Local Group</text>
  <text x="353" y="550" class="speed local-text">≈ 110 km/s</text>
  <text x="353" y="573" class="body">Andromeda’s measured radial</text>
  <text x="353" y="592" class="body">approach toward the Milky Way.</text>
  <line x1="28" y1="620" x2="517" y2="620" class="rule" />

  <!-- CMB card -->
  <circle cx="104" cy="704" r="10" fill="var(--local)" />
  <path d="M 68 732 Q 106 750 144 732" class="axis" />
  <text x="194" y="665" class="label">Local Group relative to the CMB</text>
  <text x="194" y="691" class="speed cosmic-text">≈ 627 km/s</text>
  <text x="194" y="714" class="body">Toward Galactic coordinates l = 276°, b = +30°</text>
  <text x="194" y="733" class="body">in the broad direction of Hydra.</text>
  <text x="194" y="758" class="small">The CMB supplies the practical large-scale rest frame.</text>

  <!-- Right panel: vector composition -->
  <text x="598" y="140" class="section">Why 627 km/s becomes 370 km/s</text>
  <text x="598" y="163" class="body">The Sun’s Local Group motion points partly against the Local Group’s cosmic motion.</text>
  <line x1="598" y1="184" x2="1112" y2="184" class="rule" />

  <circle cx="790" cy="437" r="7" class="open-dot" />
  <circle cx="610" cy="199" r="6" class="open-dot" />
  <circle cx="695" cy="313" r="7" fill="var(--result)" />

  <rect x="595" y="218" width="152" height="48" rx="10" class="pill" />
  <text x="610" y="238" class="small">LOCAL GROUP / CMB</text>
  <text x="610" y="256" class="label cosmic-text">627 km/s</text>

  <rect x="580" y="278" width="151" height="48" rx="10" class="pill" />
  <text x="595" y="298" class="small">SUN / LOCAL GROUP</text>
  <text x="595" y="316" class="label local-text">≈ 308 km/s</text>

  <rect x="809" y="334" width="172" height="48" rx="10" class="pill" />
  <text x="824" y="354" class="small">SOLAR SYSTEM / CMB</text>
  <text x="824" y="372" class="label result-text">≈ 370 km/s</text>

  <text x="598" y="488" class="equation">
    <tspan class="cosmic-text">v</tspan><tspan baseline-shift="sub" font-size="11">LG/CMB</tspan>
    <tspan> + </tspan>
    <tspan class="local-text">v</tspan><tspan baseline-shift="sub" font-size="11">Sun/LG</tspan>
    <tspan> = </tspan>
    <tspan class="result-text">v</tspan><tspan baseline-shift="sub" font-size="11">Sun/CMB</tspan>
  </text>
  <text x="598" y="520" class="body">The resultant points toward l ≈ 264°, b ≈ +48°—in the direction of Leo.</text>
  <text x="598" y="542" class="body">Arrow geometry is schematic; the numerical directions are three-dimensional.</text>

  <!-- Reference-frame ladder -->
  <line x1="598" y1="574" x2="1112" y2="574" class="rule" />
  <text x="598" y="605" class="section">Reference-frame ladder</text>
  <rect x="598" y="628" width="108" height="54" rx="10" class="pill" />
  <rect x="730" y="628" width="108" height="54" rx="10" class="pill" />
  <rect x="862" y="628" width="108" height="54" rx="10" class="pill" />
  <rect x="994" y="628" width="118" height="54" rx="10" class="pill" />
  <path d="M 706 655 L 726 655" class="orbit-line" marker-end="url(#arrow-orbit)" />
  <path d="M 838 655 L 858 655" class="galactic-line" marker-end="url(#arrow-galactic)" />
  <path d="M 970 655 L 990 655" class="cosmic-line" marker-end="url(#arrow-cosmic)" />
  <text x="652" y="650" text-anchor="middle" class="label">Earth</text>
  <text x="652" y="668" text-anchor="middle" class="small">Sun frame</text>
  <text x="784" y="650" text-anchor="middle" class="label">Sun</text>
  <text x="784" y="668" text-anchor="middle" class="small">Galactic frame</text>
  <text x="916" y="650" text-anchor="middle" class="label">Milky Way</text>
  <text x="916" y="668" text-anchor="middle" class="small">Local Group</text>
  <text x="1053" y="650" text-anchor="middle" class="label">Local Group</text>
  <text x="1053" y="668" text-anchor="middle" class="small">CMB frame</text>

  <text x="598" y="723" class="body">There is no absolute stationary background in physics. “Which way?” only becomes</text>
  <text x="598" y="743" class="body">well-defined after choosing the object and the frame it is measured against.</text>

  <!-- Footer -->
  <text x="0" y="839" class="small">Speeds are rounded. Directions use Galactic longitude (l) and latitude (b). Diagram arrows are not to common scale.</text>
  <text x="0" y="863" class="small">Sources: NASA LAMBDA/Planck CMB dipole; ESA Gaia; NASA/IPAC Extragalactic Database; van der Marel et al. (2012).</text>
</svg>
</main>
